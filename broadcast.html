<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>webrtcast · broadcast</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 15px/1.4 system-ui, -apple-system, sans-serif;
    background: #0b0b0d;
    color: #eee;
    overflow: hidden;
  }
  .app { position: fixed; inset: 0; }

  /* ---------- Lobby ---------- */
  .lobby { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card {
    width: min(420px, 100%);
    background: #16161a;
    border: 1px solid #26262c;
    border-radius: 20px;
    padding: 26px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .card h1 { margin: 0; font-size: 21px; }
  .card .sub { margin: 0; color: #9a9aa5; font-size: 14px; }
  .btn-primary {
    padding: 15px; border: 0; border-radius: 14px;
    background: #25d366; color: #032; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  .btn-primary:disabled { opacity: .5; cursor: default; }

  /* ---------- Stage ---------- */
  .stage { position: absolute; inset: 0; background: #000; display: none; }
  .stage.show { display: block; }
  video.fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  video.pip {
    position: absolute; right: 14px; bottom: calc(108px + env(safe-area-inset-bottom));
    width: 30vw; max-width: 148px; aspect-ratio: 3 / 4;
    object-fit: cover; border-radius: 16px;
    border: 2px solid rgba(255,255,255,.3);
    box-shadow: 0 8px 24px rgba(0,0,0,.55);
    z-index: 6; cursor: pointer; touch-action: none; background: #222;
  }
  .stage:not(.has-pip) video.pip { display: none; }
  /* Mirror the self-view (local camera) like a selfie preview */
  #local { transform: scaleX(-1); }

  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 8;
    padding: calc(12px + env(safe-area-inset-top)) 14px 18px;
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(#000b, #0000);
    transition: opacity .3s;
  }
  .chip {
    font-size: 13px; color: #eee; background: rgba(0,0,0,.4);
    border: 1px solid rgba(255,255,255,.12);
    padding: 7px 12px; border-radius: 999px; backdrop-filter: blur(8px);
  }
  .chip.code-chip { font-weight: 700; letter-spacing: 2px; color: #25d366; cursor: pointer; }
  .chip.error { color: #ff8a8a; }
  .spacer { flex: 1; }

  .controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 8;
    padding: 18px 18px calc(20px + env(safe-area-inset-bottom));
    display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
    background: linear-gradient(#0000, #000b);
    transition: opacity .3s, transform .3s;
  }
  .ctrl {
    width: 58px; height: 58px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.16); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; position: relative;
    backdrop-filter: blur(8px);
  }
  .ctrl svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ctrl.off { background: #fff; color: #111; }
  .ctrl.off::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 36px; height: 2px; background: currentColor;
    transform: translate(-50%, -50%) rotate(-45deg); border-radius: 2px;
  }
  .ctrl.end { background: #e5484d; color: #fff; }
  .ctrl.end svg { transform: rotate(135deg); }
  .faded { opacity: 0; pointer-events: none; }

  /* ---------- Share sheet ---------- */
  .sheet { position: absolute; inset: 0; z-index: 12; display: none; align-items: flex-end; background: rgba(0,0,0,.55); }
  .sheet.show { display: flex; }
  .sheet-inner {
    width: 100%; background: #16161a; border-radius: 22px 22px 0 0;
    padding: 22px 22px calc(26px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 14px;
    animation: rise .25s ease;
  }
  @keyframes rise { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  .sheet h2 { margin: 0; font-size: 16px; }
  .sheet .hint { margin: 0; font-size: 13px; color: #9a9aa5; }
  .code-big { font: 700 34px/1 ui-monospace, monospace; letter-spacing: 8px; color: #25d366; text-align: center; padding: 14px 0; user-select: all; }
  .sheet-row { display: flex; gap: 10px; }
  .sheet-row a, .sheet-row button {
    flex: 1; text-align: center; text-decoration: none;
    padding: 13px; border-radius: 12px; border: 0; font: inherit; font-weight: 700; cursor: pointer;
  }
  .wa { background: #25d366; color: #032; }
  .ghost { background: #2a2a31; color: #eee; }
</style>
</head>
<body>
<div class="app">

  <!-- Lobby -->
  <div class="lobby" id="lobby">
    <div class="card">
      <div>
        <h1>Start a broadcast</h1>
        <p class="sub">Go live and share a 6-letter code with whoever should watch.</p>
      </div>
      <button class="btn-primary" id="start">Start broadcast</button>
      <p class="sub" style="text-align:center"><a href="view.html" style="color:#9ad">Join someone else's stream →</a></p>
    </div>
  </div>

  <!-- Stage -->
  <div class="stage" id="stage">
    <video id="local" class="fill" autoplay playsinline muted></video>
    <video id="remote" class="pip" autoplay playsinline></video>

    <div class="topbar" id="topbar">
      <div class="chip code-chip" id="codeChip" title="Tap to share"></div>
      <div class="chip" id="status">Connecting…</div>
      <div class="spacer"></div>
    </div>

    <div class="controls" id="controls">
      <button class="ctrl" id="mic" title="Mute">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
      </button>
      <button class="ctrl" id="cam" title="Camera">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>
      </button>
      <button class="ctrl" id="flip" title="Switch camera">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 4v5h-5"/></svg>
      </button>
      <button class="ctrl" id="share" title="Share code">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
      </button>
      <button class="ctrl end" id="end" title="Stop">
        <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.6a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.5-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.6 2.6.7a2 2 0 0 1 1.7 2z"/></svg>
      </button>
    </div>

    <!-- Share sheet -->
    <div class="sheet" id="sheet">
      <div class="sheet-inner">
        <h2>Invite a viewer</h2>
        <p class="hint">Share this code or the link. They open the viewer page and enter it.</p>
        <div class="code-big" id="codeBig"></div>
        <div class="sheet-row">
          <button class="ghost" id="copy">Copy link</button>
          <a class="wa" id="whatsapp" target="_blank" rel="noopener">WhatsApp</a>
        </div>
        <button class="ghost" id="sheetClose" style="margin-top:4px">Done</button>
      </div>
    </div>
  </div>

</div>

<script>
const SIGNAL_URL = "wss://dashboard.dronnayak.com/ws";
const ICE = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

const $ = (id) => document.getElementById(id);
const lobby = $("lobby"), stage = $("stage");
const startBtn = $("start"), endBtn = $("end");
const micBtn = $("mic"), camBtn = $("cam"), flipBtn = $("flip"), shareBtn = $("share");
const localV = $("local"), remoteV = $("remote");
const topbar = $("topbar"), controls = $("controls");
const statusEl = $("status"), codeChip = $("codeChip"), codeBig = $("codeBig");
const sheet = $("sheet"), copyBtn = $("copy"), waLink = $("whatsapp"), sheetClose = $("sheetClose");

let ws = null, pc = null, localStream = null, topic = "";
let mainIsLocal = true;       // broadcaster sees themselves big by default
let facing = "user";

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle("error", isError);
}

function makeTopic() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function waitForIceGathering(pc) {
  if (pc.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((resolve) => {
    const check = () => {
      if (pc.iceGatheringState === "complete") {
        pc.removeEventListener("icegatheringstatechange", check);
        resolve();
      }
    };
    pc.addEventListener("icegatheringstatechange", check);
  });
}

async function parseSignal(data) {
  const text = typeof data === "string" ? data : await data.text();
  try { return JSON.parse(text); } catch { return null; }
}

function viewerLink() { return new URL("view.html?topic=" + topic, location.href).href; }

/* ---------- Layout: fill vs pip ---------- */
function applyLayout() {
  const mainEl = mainIsLocal ? localV : remoteV;
  const pipEl  = mainIsLocal ? remoteV : localV;
  mainEl.className = "fill";
  pipEl.className = "pip";
  // clear any leftover drag offsets on BOTH elements so the fill snaps back to inset:0
  mainEl.style.left = mainEl.style.top = mainEl.style.right = mainEl.style.bottom = "";
  pipEl.style.left = pipEl.style.top = pipEl.style.right = pipEl.style.bottom = "";
  // show the pip only when it actually has a stream
  stage.classList.toggle("has-pip", !!pipEl.srcObject);
}
function refreshPip() { stage.classList.toggle("has-pip", !!(mainIsLocal ? remoteV : localV).srcObject); }

/* ---------- Controls auto-hide ---------- */
let hideTimer = null;
function showControls() {
  topbar.classList.remove("faded"); controls.classList.remove("faded");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { topbar.classList.add("faded"); controls.classList.add("faded"); }, 4000);
}
stage.addEventListener("click", (e) => {
  if (e.target.classList.contains("pip")) return;   // pip handles its own taps
  if (sheet.classList.contains("show")) return;
  showControls();
});

/* ---------- Draggable + tap-to-swap pip ---------- */
function bindPip(el) {
  let sx, sy, ox, oy, dragging = false, moved = false;
  el.addEventListener("pointerdown", (e) => {
    if (!el.classList.contains("pip")) return;
    dragging = true; moved = false;
    sx = e.clientX; sy = e.clientY;
    const r = el.getBoundingClientRect(); ox = r.left; oy = r.top;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
    el.style.left = (ox + dx) + "px"; el.style.top = (oy + dy) + "px";
    el.style.right = "auto"; el.style.bottom = "auto";
  });
  el.addEventListener("pointerup", () => {
    if (!dragging) return;
    dragging = false;
    if (!moved) { mainIsLocal = !mainIsLocal; applyLayout(); showControls(); }
  });
}
bindPip(localV); bindPip(remoteV);

/* ---------- Broadcast flow ---------- */
async function start() {
  startBtn.disabled = true;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: true });
  } catch (err) {
    startBtn.disabled = false;
    alert("Could not access camera/mic.\n" + err);
    return;
  }
  localV.srcObject = localStream;
  mainIsLocal = true; applyLayout();
  updateTrackButtons();

  topic = makeTopic();
  codeChip.textContent = topic;
  codeBig.textContent = topic;
  waLink.href = "https://wa.me/?text=" + encodeURIComponent(`Join my live video. Code: ${topic}\n${viewerLink()}`);

  lobby.style.display = "none";
  stage.classList.add("show");
  sheet.classList.add("show");      // prompt to share right away
  showControls();

  const url = SIGNAL_URL + (SIGNAL_URL.includes("?") ? "&" : "?") + "topic=" + encodeURIComponent(topic) + "&role=producer";
  ws = new WebSocket(url);
  ws.onopen = () => setStatus("Live · code " + topic);
  ws.onmessage = async (ev) => {
    const sig = await parseSignal(ev.data);
    if (sig && sig.type === "offer") handleOffer(sig.sdp);
  };
  ws.onerror = () => setStatus("Signalling error", true);
  ws.onclose = () => { if (stage.classList.contains("show")) setStatus("Disconnected", true); };
}

async function handleOffer(sdp) {
  setStatus("Viewer connecting…");
  if (pc) { try { pc.close(); } catch {} }
  pc = new RTCPeerConnection(ICE);

  pc.ontrack = (e) => { remoteV.srcObject = e.streams[0]; refreshPip(); };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === "connected") setStatus("Viewer connected");
    if (["failed", "disconnected", "closed"].includes(pc.connectionState)) {
      remoteV.srcObject = null; refreshPip();
      setStatus("Live · code " + topic);
    }
  };

  try {
    await pc.setRemoteDescription({ type: "offer", sdp });
    localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await waitForIceGathering(pc);
    ws.send(JSON.stringify({ type: "answer", sdp: pc.localDescription.sdp }));
  } catch (err) {
    setStatus("Answer failed", true);
  }
}

/* ---------- Track toggles / switch camera ---------- */
function updateTrackButtons() {
  const v = localStream && localStream.getVideoTracks()[0];
  const a = localStream && localStream.getAudioTracks()[0];
  micBtn.classList.toggle("off", !(a && a.enabled));
  camBtn.classList.toggle("off", !(v && v.enabled));
}
function toggleTrack(kind) {
  if (!localStream) return;
  const t = kind === "video" ? localStream.getVideoTracks()[0] : localStream.getAudioTracks()[0];
  if (t) t.enabled = !t.enabled;
  updateTrackButtons();
}
async function switchCamera() {
  if (!localStream) return;
  facing = facing === "user" ? "environment" : "user";
  try {
    const ns = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false });
    const nt = ns.getVideoTracks()[0];
    const sender = pc && pc.getSenders().find((s) => s.track && s.track.kind === "video");
    if (sender) await sender.replaceTrack(nt);
    const old = localStream.getVideoTracks()[0];
    if (old) { localStream.removeTrack(old); old.stop(); }
    localStream.addTrack(nt);
    localV.srcObject = localStream;
    updateTrackButtons();
  } catch (err) { facing = facing === "user" ? "environment" : "user"; }
}

function stop() {
  if (ws) { try { ws.close(); } catch {} ws = null; }
  if (pc) { try { pc.close(); } catch {} pc = null; }
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  localV.srcObject = remoteV.srcObject = null;
  stage.classList.remove("show", "has-pip");
  sheet.classList.remove("show");
  lobby.style.display = "flex";
  startBtn.disabled = false;
  setStatus("Connecting…");
}

/* ---------- Wiring ---------- */
startBtn.addEventListener("click", start);
endBtn.addEventListener("click", stop);
micBtn.addEventListener("click", () => toggleTrack("audio"));
camBtn.addEventListener("click", () => toggleTrack("video"));
flipBtn.addEventListener("click", switchCamera);
shareBtn.addEventListener("click", () => sheet.classList.add("show"));
codeChip.addEventListener("click", () => sheet.classList.add("show"));
sheetClose.addEventListener("click", () => { sheet.classList.remove("show"); showControls(); });
copyBtn.addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(viewerLink()); copyBtn.textContent = "Copied!"; setTimeout(() => copyBtn.textContent = "Copy link", 1500); }
  catch {}
});
</script>
</body>
</html>
