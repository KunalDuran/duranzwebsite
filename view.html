<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>webrtcast · view</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 15px/1.4 system-ui, -apple-system, sans-serif;
    background: #0b0b0d;
    color: #eee;
    overflow: hidden;
  }
  .app { position: fixed; inset: 0; }

  /* ---------- Lobby ---------- */
  .lobby { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card {
    width: min(420px, 100%);
    background: #16161a;
    border: 1px solid #26262c;
    border-radius: 20px;
    padding: 26px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .card h1 { margin: 0; font-size: 21px; }
  .card .sub { margin: 0; color: #9a9aa5; font-size: 14px; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label { font-size: 13px; color: #9a9aa5; }
  input.code {
    padding: 16px; font: 700 24px/1 ui-monospace, monospace;
    letter-spacing: 8px; text-align: center; text-transform: uppercase;
    border-radius: 14px; border: 1px solid #2c2c34; background: #0e0e11; color: #fff;
  }
  input.code::placeholder { letter-spacing: 4px; color: #44444c; }
  .toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px; background: #0e0e11; border: 1px solid #2c2c34; border-radius: 14px; font-size: 14px; cursor: pointer;
  }
  .switch { position: relative; width: 46px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #3a3a42; border-radius: 999px; transition: .2s; }
  .slider::before { content: ''; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: #25d366; }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  .btn-primary {
    padding: 15px; border: 0; border-radius: 14px;
    background: #25d366; color: #032; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  .btn-primary:disabled { opacity: .5; cursor: default; }

  /* ---------- Stage ---------- */
  .stage { position: absolute; inset: 0; background: #000; display: none; }
  .stage.show { display: block; }
  video.fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  video.pip {
    position: absolute; right: 14px; bottom: calc(108px + env(safe-area-inset-bottom));
    width: 30vw; max-width: 148px; aspect-ratio: 3 / 4;
    object-fit: cover; border-radius: 16px;
    border: 2px solid rgba(255,255,255,.3);
    box-shadow: 0 8px 24px rgba(0,0,0,.55);
    z-index: 6; cursor: pointer; touch-action: none; background: #222;
  }
  .stage:not(.has-pip) video.pip { display: none; }
  /* Mirror the self-view (local camera) like a selfie preview */
  #local { transform: scaleX(-1); }
  .waiting {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: #9a9aa5; font-size: 15px; text-align: center; padding: 24px; z-index: 2;
  }
  .stage.connecting .waiting { display: flex; }

  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 8;
    padding: calc(12px + env(safe-area-inset-top)) 14px 18px;
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(#000b, #0000);
    transition: opacity .3s;
  }
  .chip {
    font-size: 13px; color: #eee; background: rgba(0,0,0,.4);
    border: 1px solid rgba(255,255,255,.12);
    padding: 7px 12px; border-radius: 999px; backdrop-filter: blur(8px);
  }
  .chip.error { color: #ff8a8a; }

  .controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 8;
    padding: 18px 18px calc(20px + env(safe-area-inset-bottom));
    display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
    background: linear-gradient(#0000, #000b);
    transition: opacity .3s;
  }
  .ctrl {
    width: 58px; height: 58px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.16); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; position: relative;
    backdrop-filter: blur(8px);
  }
  .ctrl[hidden] { display: none; }
  .ctrl svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ctrl.off { background: #fff; color: #111; }
  .ctrl.off::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 36px; height: 2px; background: currentColor;
    transform: translate(-50%, -50%) rotate(-45deg); border-radius: 2px;
  }
  .ctrl.end { background: #e5484d; color: #fff; }
  .ctrl.end svg { transform: rotate(135deg); }
  .faded { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="app">

  <!-- Lobby -->
  <div class="lobby" id="lobby">
    <div class="card">
      <div>
        <h1>Join a stream</h1>
        <p class="sub">Enter the code the broadcaster shared with you.</p>
      </div>
      <div class="field">
        <label for="topic">Topic code</label>
        <input id="topic" class="code" placeholder="CODE" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false">
      </div>
      <label class="toggle" for="share">
        <span>Share my camera &amp; mic</span>
        <span class="switch"><input type="checkbox" id="share"><span class="slider"></span></span>
      </label>
      <button class="btn-primary" id="connect">Connect</button>
      <p class="sub" style="text-align:center"><a href="broadcast.html" style="color:#9ad">Start your own broadcast →</a></p>
    </div>
  </div>

  <!-- Stage -->
  <div class="stage" id="stage">
    <video id="remote" class="fill" autoplay playsinline></video>
    <video id="local" class="pip" autoplay playsinline muted></video>
    <div class="waiting" id="waiting">Connecting to the broadcaster…</div>

    <div class="topbar" id="topbar">
      <div class="chip" id="status">Connecting…</div>
    </div>

    <div class="controls" id="controls">
      <button class="ctrl" id="mic" title="Mute" hidden>
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
      </button>
      <button class="ctrl" id="cam" title="Camera" hidden>
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>
      </button>
      <button class="ctrl" id="flip" title="Switch camera" hidden>
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 4v5h-5"/></svg>
      </button>
      <button class="ctrl end" id="end" title="Leave">
        <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.6a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.5-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.6 2.6.7a2 2 0 0 1 1.7 2z"/></svg>
      </button>
    </div>
  </div>

</div>

<script>
const SIGNAL_URL = "wss://dashboard.dronnayak.com/ws";
const ICE = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

const $ = (id) => document.getElementById(id);
const lobby = $("lobby"), stage = $("stage");
const topicInput = $("topic"), shareChk = $("share"), connectBtn = $("connect");
const endBtn = $("end"), micBtn = $("mic"), camBtn = $("cam"), flipBtn = $("flip");
const remoteV = $("remote"), localV = $("local");
const topbar = $("topbar"), controls = $("controls"), statusEl = $("status");

let ws = null, pc = null, localStream = null;
let mainIsLocal = false;     // viewer sees the broadcaster big by default
let facing = "user";

const params = new URLSearchParams(location.search);
if (params.get("topic")) topicInput.value = params.get("topic").toUpperCase();

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle("error", isError);
}

function waitForIceGathering(pc) {
  if (pc.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((resolve) => {
    const check = () => {
      if (pc.iceGatheringState === "complete") {
        pc.removeEventListener("icegatheringstatechange", check);
        resolve();
      }
    };
    pc.addEventListener("icegatheringstatechange", check);
  });
}

async function parseSignal(data) {
  const text = typeof data === "string" ? data : await data.text();
  try { return JSON.parse(text); } catch { return null; }
}

/* ---------- Layout: fill vs pip ---------- */
function applyLayout() {
  const mainEl = mainIsLocal ? localV : remoteV;
  const pipEl  = mainIsLocal ? remoteV : localV;
  mainEl.className = "fill";
  pipEl.className = "pip";
  // clear any leftover drag offsets on BOTH elements so the fill snaps back to inset:0
  mainEl.style.left = mainEl.style.top = mainEl.style.right = mainEl.style.bottom = "";
  pipEl.style.left = pipEl.style.top = pipEl.style.right = pipEl.style.bottom = "";
  stage.classList.toggle("has-pip", !!pipEl.srcObject);
}
function refreshPip() { stage.classList.toggle("has-pip", !!(mainIsLocal ? remoteV : localV).srcObject); }

/* ---------- Controls auto-hide ---------- */
let hideTimer = null;
function showControls() {
  topbar.classList.remove("faded"); controls.classList.remove("faded");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { topbar.classList.add("faded"); controls.classList.add("faded"); }, 4000);
}
stage.addEventListener("click", (e) => {
  if (e.target.classList.contains("pip")) return;
  showControls();
});

/* ---------- Draggable + tap-to-swap pip ---------- */
function bindPip(el) {
  let sx, sy, ox, oy, dragging = false, moved = false;
  el.addEventListener("pointerdown", (e) => {
    if (!el.classList.contains("pip")) return;
    dragging = true; moved = false;
    sx = e.clientX; sy = e.clientY;
    const r = el.getBoundingClientRect(); ox = r.left; oy = r.top;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
    el.style.left = (ox + dx) + "px"; el.style.top = (oy + dy) + "px";
    el.style.right = "auto"; el.style.bottom = "auto";
  });
  el.addEventListener("pointerup", () => {
    if (!dragging) return;
    dragging = false;
    if (!moved) { mainIsLocal = !mainIsLocal; applyLayout(); showControls(); }
  });
}
bindPip(localV); bindPip(remoteV);

/* ---------- Connect flow ---------- */
async function connect() {
  const topic = topicInput.value.trim().toUpperCase();
  if (!topic) { topicInput.focus(); return; }

  connectBtn.disabled = true;
  pc = new RTCPeerConnection(ICE);
  pc.ontrack = (e) => {
    remoteV.srcObject = e.streams[0];
    stage.classList.remove("connecting");
    refreshPip();
    setStatus("Live");
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === "connected") { stage.classList.remove("connecting"); setStatus("Live"); }
    if (["failed", "disconnected", "closed"].includes(pc.connectionState)) leave();
  };

  if (shareChk.checked) {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: true });
      localV.srcObject = localStream;
      localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
      micBtn.hidden = camBtn.hidden = flipBtn.hidden = false;
      updateTrackButtons();
    } catch (err) {
      setStatus("View-only (no camera access)");
    }
  }
  if (!localStream) {
    pc.addTransceiver("video", { direction: "recvonly" });
    pc.addTransceiver("audio", { direction: "recvonly" });
  }

  mainIsLocal = false; applyLayout();
  lobby.style.display = "none";
  stage.classList.add("show", "connecting");
  showControls();

  const url = SIGNAL_URL + (SIGNAL_URL.includes("?") ? "&" : "?") + "topic=" + encodeURIComponent(topic) + "&role=subscriber";
  ws = new WebSocket(url);

  ws.onopen = async () => {
    setStatus("Connecting…");
    try {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitForIceGathering(pc);
      ws.send(JSON.stringify({ type: "offer", sdp: pc.localDescription.sdp }));
    } catch (err) { setStatus("Offer failed", true); }
  };
  ws.onmessage = async (ev) => {
    const sig = await parseSignal(ev.data);
    if (!sig || sig.type !== "answer") return;
    try { await pc.setRemoteDescription({ type: "answer", sdp: sig.sdp }); }
    catch (err) { setStatus("Failed to connect", true); }
  };
  ws.onerror = () => setStatus("Signalling error", true);
  ws.onclose = () => { if (stage.classList.contains("connecting")) setStatus("Broadcaster offline?", true); };
}

/* ---------- Track toggles / switch camera ---------- */
function updateTrackButtons() {
  const v = localStream && localStream.getVideoTracks()[0];
  const a = localStream && localStream.getAudioTracks()[0];
  micBtn.classList.toggle("off", !(a && a.enabled));
  camBtn.classList.toggle("off", !(v && v.enabled));
}
function toggleTrack(kind) {
  if (!localStream) return;
  const t = kind === "video" ? localStream.getVideoTracks()[0] : localStream.getAudioTracks()[0];
  if (t) t.enabled = !t.enabled;
  updateTrackButtons();
}
async function switchCamera() {
  if (!localStream) return;
  facing = facing === "user" ? "environment" : "user";
  try {
    const ns = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false });
    const nt = ns.getVideoTracks()[0];
    const sender = pc && pc.getSenders().find((s) => s.track && s.track.kind === "video");
    if (sender) await sender.replaceTrack(nt);
    const old = localStream.getVideoTracks()[0];
    if (old) { localStream.removeTrack(old); old.stop(); }
    localStream.addTrack(nt);
    localV.srcObject = localStream;
    updateTrackButtons();
  } catch (err) { facing = facing === "user" ? "environment" : "user"; }
}

function leave() {
  if (ws) { try { ws.close(); } catch {} ws = null; }
  if (pc) { try { pc.close(); } catch {} pc = null; }
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  remoteV.srcObject = localV.srcObject = null;
  stage.classList.remove("show", "has-pip", "connecting");
  micBtn.hidden = camBtn.hidden = flipBtn.hidden = true;
  lobby.style.display = "flex";
  connectBtn.disabled = false;
  setStatus("Connecting…");
}

/* ---------- Wiring ---------- */
connectBtn.addEventListener("click", connect);
endBtn.addEventListener("click", leave);
micBtn.addEventListener("click", () => toggleTrack("audio"));
camBtn.addEventListener("click", () => toggleTrack("video"));
flipBtn.addEventListener("click", switchCamera);
topicInput.addEventListener("keydown", (e) => { if (e.key === "Enter") connect(); });
</script>
</body>
</html>
